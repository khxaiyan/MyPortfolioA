<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0e" />
      <stop offset="50%" stop-color="#0d0e15" />
      <stop offset="100%" stop-color="#141522" />
    </linearGradient>

    <!-- Accent Glow Filter -->
    <radialGradient id="redGlow" cx="25%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ff2a5f" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0a0a0e" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="avatarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff2a5f" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ff2a5f" stop-opacity="0" />
    </radialGradient>

    <!-- Clip Path for Circular Avatar -->
    <clipPath id="avatarClip">
      <circle cx="950" cy="315" r="180" />
    </clipPath>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#redGlow)" />

  <!-- Outer Border -->
  <rect x="2" y="2" width="1196" height="626" rx="28" fill="none" stroke="#232638" stroke-width="3" />

  <!-- Subtle Ambient Circuit Accent Lines -->
  <path d="M 80 540 L 400 540 L 440 500 L 700 500" fill="none" stroke="#ff2a5f" stroke-width="1.5" stroke-opacity="0.25" />
  <circle cx="80" cy="540" r="4" fill="#ff2a5f" fill-opacity="0.4" />
  <circle cx="700" cy="500" r="4" fill="#ff2a5f" fill-opacity="0.4" />

  <!-- Wordmark Branding (Left Column) -->
  <g transform="translate(90, 160)">
    <!-- Site Wordmark -->
    <text font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="82" font-weight="800" fill="#ffffff" letter-spacing="-1.5">
      kh<tspan fill="#ff2a5f">x</tspan>aiyan
    </text>

    <!-- Role / Tagline Subtitle -->
    <text y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="600" fill="#e1e3ec" letter-spacing="-0.3">
      Developer in active building mode.
    </text>
    <text y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="400" fill="#8e94ad">
      Crafting clean web tools, interactive interfaces &amp; digital experiences.
    </text>

    <!-- Technology Badges Row -->
    <g transform="translate(0, 175)">
      <!-- Badge 1: TypeScript -->
      <g transform="translate(0, 0)">
        <rect width="145" height="42" rx="10" fill="#141622" stroke="#292c42" stroke-width="1.2" />
        <text x="72" y="26" font-family="ui-monospace, monospace" font-size="16" font-weight="600" fill="#d0d4e8" text-anchor="middle">TypeScript</text>
      </g>

      <!-- Badge 2: Node.js -->
      <g transform="translate(160, 0)">
        <rect width="125" height="42" rx="10" fill="#141622" stroke="#292c42" stroke-width="1.2" />
        <text x="62" y="26" font-family="ui-monospace, monospace" font-size="16" font-weight="600" fill="#d0d4e8" text-anchor="middle">Node.js</text>
      </g>

      <!-- Badge 3: React -->
      <g transform="translate(300, 0)">
        <rect width="105" height="42" rx="10" fill="#141622" stroke="#292c42" stroke-width="1.2" />
        <text x="52" y="26" font-family="ui-monospace, monospace" font-size="16" font-weight="600" fill="#d0d4e8" text-anchor="middle">React</text>
      </g>

      <!-- Badge 4: Python -->
      <g transform="translate(420, 0)">
        <rect width="115" height="42" rx="10" fill="#141622" stroke="#292c42" stroke-width="1.2" />
        <text x="57" y="26" font-family="ui-monospace, monospace" font-size="16" font-weight="600" fill="#d0d4e8" text-anchor="middle">Python</text>
      </g>
    </g>

    <!-- Live Website Pill -->
    <g transform="translate(0, 260)">
      <rect width="255" height="46" rx="23" fill="#131420" stroke="#ff2a5f" stroke-width="1.4" stroke-opacity="0.75" />
      <circle cx="24" cy="23" r="6" fill="#ff2a5f" />
      <text x="44" y="29" font-family="ui-monospace, monospace" font-size="18" font-weight="600" fill="#ffffff">khxaiyan.vercel.app</text>
    </g>
  </g>

  <!-- Avatar Section (Right Column) -->
  <g>
    <!-- Outer Glow -->
    <circle cx="950" cy="315" r="215" fill="url(#avatarGlow)" />

    <!-- Outer Accent Ring -->
    <circle cx="950" cy="315" r="190" fill="none" stroke="#ff2a5f" stroke-width="3" stroke-dasharray="12 8" />

    <!-- Inner Surface Background -->
    <circle cx="950" cy="315" r="180" fill="#181926" stroke="#2f334a" stroke-width="2" />

    <!-- Avatar Image -->
    <image href="https://avatars.githubusercontent.com/u/225553218?v=4" x="770" y="135" width="360" height="360" clip-path="url(#avatarClip)" preserveAspectRatio="xMidYMid slice" />
  </g>
</svg>
