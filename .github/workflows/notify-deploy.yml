name: Trigger Deploy on Pages

on:
  push:
    branches: ["main"]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger khxaiyan.github.io workflow
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.PAGES_TOKEN }}" \
            https://api.github.com/repos/khxaiyan/khxaiyan.github.io/actions/workflows/deploy.yml/dispatches \
            -d '{"ref":"main"}'
