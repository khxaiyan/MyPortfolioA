<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>khxaiyan</title>
  <meta name="description"
    content="khxaiyan | Developer in active building mode. Crafting clean web tools & interfaces.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://khxaiyan.github.io/">
  <meta property="og:title" content="khxaiyan">
  <meta property="og:description"
    content="khxaiyan | Developer in active building mode. Crafting clean web tools & interfaces.">
  <meta property="og:image" content="https://khxaiyan.github.io/logo.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:site" content="@khxaiyan">
  <meta name="twitter:title" content="khxaiyan">
  <meta name="twitter:description"
    content="khxaiyan | Developer in active building mode. Crafting clean web tools & interfaces.">
  <meta name="twitter:image" content="https://khxaiyan.github.io/logo.png">
  <link rel="icon" href="logo.png" type="image/png">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="canonical" href="https://khxaiyan.github.io/">
  <meta name="theme-color" id="meta-theme-color" content="#0a0a0e">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    (function () {
      var t = localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme:light)').matches ? 'light' : 'dark');
      document.documentElement.setAttribute('data-theme', t);
    }());
  </script>
</head>

<body>

  <main class="sheet">

    <!-- ── Identity (root rail row) ── -->
    <div class="rail-row rail-row--root">
      <div class="rail-col">
        <div class="rail-line"></div>
      </div>
      <div class="content-col id-col">
        <div class="id-block">
          <button class="avatar-wrap" id="avatar-wrap" aria-label="Toggle theme">
            <img class="avatar-img" src="logo.png" alt="khxaiyan" width="88" height="88" loading="eager">
            <span class="theme-badge" id="theme-badge" aria-hidden="true">
              <!-- Sun icon: visible in dark mode -->
              <svg class="badge-sun" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="4" />
                <path
                  d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" />
              </svg>
              <!-- Moon icon: visible in light mode -->
              <svg class="badge-moon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
              </svg>
            </span>
          </button>
          <div class="id-text">
            <h1 class="wordmark">kh<span class="glyph-5">x</span>aiyan</h1>
            <p class="bio">developer in active building mode.<br>crafting clean web tools &amp; digital experiences.</p>
          </div>
        </div>
      </div>
    </div>

    <!-- ── Projects ── -->
    <div class="rail-row">
      <div class="rail-col">
        <div class="rail-line"></div>
        <div class="rail-node"></div>
      </div>
      <div class="content-col">
        <p class="eyebrow">// projects</p>
        <div class="surface-card" id="projects-container">
          <div class="org-row bone-row">
            <div class="project-avatar bone"></div>
            <div class="org-row-text">
              <div class="bone bone-title"></div>
              <div class="bone bone-desc"></div>
            </div>
            <div class="org-row-stats">
              <div class="bone bone-stat-top"></div>
              <div class="bone bone-stat-bot"></div>
            </div>
          </div>
          <div class="org-row bone-row">
            <div class="project-avatar bone"></div>
            <div class="org-row-text">
              <div class="bone bone-title" style="width: 52%;"></div>
              <div class="bone bone-desc" style="width: 82%;"></div>
            </div>
            <div class="org-row-stats">
              <div class="bone bone-stat-top"></div>
              <div class="bone bone-stat-bot"></div>
            </div>
          </div>
          <div class="org-row bone-row">
            <div class="project-avatar bone"></div>
            <div class="org-row-text">
              <div class="bone bone-title" style="width: 38%;"></div>
              <div class="bone bone-desc" style="width: 65%;"></div>
            </div>
            <div class="org-row-stats">
              <div class="bone bone-stat-top"></div>
              <div class="bone bone-stat-bot"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ── Reach ── -->
    <div class="rail-row">
      <div class="rail-col">
        <div class="rail-line"></div>
        <div class="rail-node"></div>
      </div>
      <div class="content-col">
        <p class="eyebrow">// reach</p>
        <div class="channel-list">
          <a class="channel-row" id="link-github" href="https://github.com/khxaiyan" target="_blank"
            rel="noopener noreferrer">
            <svg class="channel-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path
                d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4" />
              <path d="M9 18c-4.51 2-5-2-7-2" />
            </svg>
            <span class="channel-name">GitHub</span>
            <svg class="channel-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M7 17L17 7M17 7H7M17 7v10" />
            </svg>
          </a>
          <a class="channel-row" id="link-telegram" href="https://t.me/khxaiyan" target="_blank"
            rel="noopener noreferrer">
            <svg class="channel-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m22 2-7 20-4-9-9-4Z" />
              <path d="M22 2 11 13" />
            </svg>
            <span class="channel-name">Telegram</span>
            <svg class="channel-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M7 17L17 7M17 7H7M17 7v10" />
            </svg>
          </a>
          <a class="channel-row" id="link-x" href="https://x.com/khxaiyan" target="_blank" rel="noopener noreferrer">
            <svg class="channel-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path
                d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z" />
            </svg>
            <span class="channel-name">X</span>
            <svg class="channel-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M7 17L17 7M17 7H7M17 7v10" />
            </svg>
          </a>
          <a class="channel-row" id="link-email" href="mailto:[EMAIL_ADDRESS]">
            <svg class="channel-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="2" y="4" width="20" height="16" rx="3" />
              <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
            </svg>
            <span class="channel-name">Email</span>
            <svg class="channel-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M7 17L17 7M17 7H7M17 7v10" />
            </svg>
          </a>
        </div>
      </div>
    </div>

    <!-- ── Message (last rail row) ── -->
    <div class="rail-row rail-row--last">
      <div class="rail-col">
        <div class="rail-line"></div>
        <div class="rail-node"></div>
      </div>
      <div class="content-col">
        <p class="eyebrow">// message</p>
        <div class="msg-field">
          <textarea id="cf-message" rows="5"
            placeholder="Write your message ( leave an email if you want a reply )"></textarea>
        </div>
        <input type="checkbox" name="botcheck" id="botcheck" style="display:none;" tabindex="-1" aria-hidden="true">
        <div id="hcaptcha-container" class="h-captcha" data-sitekey="4e42ae9a-c9a2-4a7a-b9ae-0526a248f402"></div>
        <button class="send-btn" id="cf-submit" type="button">
          <span>Send message</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h14" />
            <path d="m12 5 7 7-7 7" />
          </svg>
        </button>
        <p id="contact-status" class="status-msg" role="status" aria-live="polite"></p>
      </div>
    </div>

  </main>

  <div id="sr-alert" role="alert" aria-live="assertive" class="sr-only"></div>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script src="https://js.hcaptcha.com/1/api.js?onload=initHcaptcha&render=explicit" async defer></script>
</body>

</html>
